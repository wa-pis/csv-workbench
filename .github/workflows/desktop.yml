name: Desktop builds
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0
      - run: uv sync --locked --python 3.12 --extra dev --extra build
      - run: uv run --locked --extra dev --extra build pytest
      - run: uv run --locked --extra build python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-workbench-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/csv-workbench-*.zip
            dist/csv-workbench-*.tar.gz
          if-no-files-found: error

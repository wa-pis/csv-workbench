[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "csv-workbench"
version = "0.1.0"
description = "Cross-platform desktop CSV explorer powered by DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1,<2", "PySide6-Essentials>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
build = [
    "pyinstaller>=6,<7",
]

[project.scripts]
csv-workbench = "csv_workbench.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_workbench"]

[tool.ruff]
line-length = 100

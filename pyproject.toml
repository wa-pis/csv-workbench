[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "csv-workbench"
version = "0.1.0"
description = "Cross-platform desktop CSV explorer powered by DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4,<4",
    "duckdb>=1.1,<2",
    "polars>=1.42,<2",
    "PySide6-Essentials>=6.7,<7; sys_platform != 'darwin'",
    "PySide6-Essentials==6.12.0a1.dev1795190098; sys_platform == 'darwin'",
    "shiboken6==6.12.0a1.dev1795190098; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
build = [
    "pyinstaller>=6,<7",
]

[project.scripts]
csv-workbench = "csv_workbench.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_workbench"]

[tool.ruff]
line-length = 100

# QTBUG-149612: stable Qt 6.12.0 deletes live table accessibility interfaces.
# Replace this immutable official snapshot with stable PySide6 6.12.1 once released.
[tool.uv.sources]
PySide6-Essentials = { url = "https://download.qt.io/snapshots/ci/pyside/6.12/a97d38fe94be33d879e03f35321833a33a141061/pyside6/pyside6_essentials-6.12.0a1.dev1795190098-cp310-abi3-macosx_14_0_universal2.whl", marker = "sys_platform == 'darwin'" }
shiboken6 = { url = "https://download.qt.io/snapshots/ci/pyside/6.12/a97d38fe94be33d879e03f35321833a33a141061/pyside6/shiboken6-6.12.0a1.dev1795190098-cp310-abi3-macosx_14_0_universal2.whl", marker = "sys_platform == 'darwin'" }

schema: spec-driven

context: |
  CSV Workbench — локальное настольное Python-приложение для macOS, Windows и Linux.
  Базовый стек: Python 3.12+, uv, PySide6, DuckDB, pytest, Ruff.
  Исходные CSV никогда не перезаписываются. Интерфейс получает ограниченные порции строк.
  Порядок этапов и критерии готовности описаны в ROADMAP.md.
  Артефакты пишутся на русском; структурные заголовки OpenSpec и SHALL/MUST остаются на английском.
